server.port=${SERVER_PORT:18080}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:dealflow360}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=${MYSQL_USER:dealflow}
spring.datasource.password=${MYSQL_PASSWORD:dealflow360}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=dealflow360
